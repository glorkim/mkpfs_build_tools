[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mkpfs-worker"
version = "0.1.0"
description = "Standalone GPL-3.0 CLI worker exposing mkpfs operations over subprocess, so closed-source callers never import mkpfs directly."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "mkpfs>=0.0.8",
]

[project.scripts]
mkpfs-worker = "mkpfs_worker.cli:main"

[tool.setuptools.packages.find]
include = ["mkpfs_worker*"]
